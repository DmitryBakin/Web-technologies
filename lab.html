<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>О себе</title>
</head>
<body>
    <header>
        <span class="badge">★</span>
        <h1>Любитель кино и сериалов</h1>
        <h2>Бакин Дмитрий</h2>

        <figure>
            <img src="https://skyteach.ru/wp-content/cache/thumb/a5/6819de9b3c255a5_920x0.jpg"
                 alt="Портрет Дмитрия" width="460" height="265">
        </figure>
    </header>

    <nav>
        <ul>
            <li><a href="#top-films">Проекты</a></li>
            <li><a href="#directors">Режиссёры</a></li>
            <li><a href="#feedback">Обратная связь</a></li>
        </ul>
    </nav>

    <main>
        <section id="projects">
            <h3>Проекты</h3>

            <div class="films-flex">
                <article class="film-card">
                    <img class="film-poster"
                         src="https://picsum.photos/seed/avatar/160/240"
                         alt="Постер фильма Аватар" width="80" height="120">
                    <div class="film-info">
                        <h4>Аватар</h4>
                        <p>Фантастика · 2009</p>
                        <a class="btn-details" href="https://www.kinopoisk.ru/film/251733/"
                           target="_blank">Подробнее</a>
                    </div>
                </article>

                <article class="film-card">
                    <img class="film-poster"
                         src="https://picsum.photos/seed/coach/160/240"
                         alt="Постер фильма Тренер" width="80" height="120">
                    <div class="film-info">
                        <h4>Тренер</h4>
                        <p>Драма · 2018</p>
                        <a class="btn-details" href="https://www.kinopoisk.ru/film/981230/"
                           target="_blank">Подробнее</a>
                    </div>
                </article>

                <article class="film-card">
                    <img class="film-poster"
                         src="https://picsum.photos/seed/interstellar/160/240"
                         alt="Постер фильма Интерстеллар" width="80" height="120">
                    <div class="film-info">
                        <h4>Интерстеллар</h4>
                        <p>Фантастика · 2014</p>
                        <a class="btn-details" href="https://www.kinopoisk.ru/film/258687/"
                           target="_blank">Подробнее</a>
                    </div>
                </article>

                <article class="film-card">
                    <img class="film-poster"
                         src="https://picsum.photos/seed/bar/160/240"
                         alt="Постер сериала Бар Один звонок" width="80" height="120">
                    <div class="film-info">
                        <h4>Бар «Один звонок»</h4>
                        <p>Драма · 2023</p>
                        <a class="btn-details" href="https://www.kinopoisk.ru/series/5333424/"
                           target="_blank">Подробнее</a>
                    </div>
                </article>
            </div>
        </section>

        <section id="directors">
            <h3>Популярные режиссёры</h3>

            <div class="directors-grid">
                <figure>
                    <img src="https://picsum.photos/seed/nolan/400/400"
                         alt="Кристофер Нолан" width="400" height="400">
                    <figcaption>
                        <strong>Кристофер Нолан</strong>
                        <span>«Начало» (2010)</span>
                    </figcaption>
                </figure>

                <figure>
                    <img src="https://picsum.photos/seed/cameron/400/400"
                         alt="Джеймс Кэмерон" width="400" height="400">
                    <figcaption>
                        <strong>Джеймс Кэмерон</strong>
                        <span>«Аватар» (2009)</span>
                    </figcaption>
                </figure>

                <figure>
                    <img src="https://picsum.photos/seed/villeneuve/400/400"
                         alt="Дени Вильнёв" width="400" height="400">
                    <figcaption>
                        <strong>Дени Вильнёв</strong>
                        <span>«Дюна» (2021)</span>
                    </figcaption>
                </figure>

                <figure>
                    <img src="https://picsum.photos/seed/tarantino/400/400"
                         alt="Квентин Тарантино" width="400" height="400">
                    <figcaption>
                        <strong>Квентин Тарантино</strong>
                        <span>«Криминальное чтиво» (1994)</span>
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; Copyright 2026</p>
    </footer>
</body>
</html>
