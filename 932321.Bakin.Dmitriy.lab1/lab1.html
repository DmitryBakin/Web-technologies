<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>О себе</title>   
</head>

    <body style="display: flex; background-color: rgb(212, 175, 55); min-height: 100dvh; flex-direction: column; height: 100%">
        <header>
            <h1>Любитель кино и сериалов</h1>
            <h2>Бакин Дмитрий</h2>
            <figure>
                <img src="https://skyteach.ru/wp-content/cache/thumb/a5/6819de9b3c255a5_920x0.jpg" alt="cinema_jpg" width="460" height="265">
            </figure>
        </header>

        <main>
            <section>
                <h3>Навыки</h3>
                <ul>
                    <li>Базовый монтаж </li>
                    <li>Базовое понимание жанров</li>
                    <li>Умение подбирать саундтреки</li>
                </ul>
            </section>
            
            <section>
                <h3>Проекты</h3>
                <ol>
                    <li><strong>Аватар</strong></li>
                    <li><strong>Тренер</strong></li>
                    <li><strong>Бар «Один звонок»</strong></li>
                </ol>
            </section>
        </main>

        <aside>
            <h3>Любимый жанр</h3>
            <p>Научная фантастика</p>
        </aside>

        <section>
            <h2>Обратная связь</h2>
            <form>
                <label>Имя:
                    <input type="text" name="user_name" placeholder="Введите ваше имя" required>
                </label>
                <label>Email:
                    <input type="email" name="user_email" placeholder="example@mail.ru" required>
                </label>
                <label>Сообщение:
                    <textarea name="user_message" placeholder="Напишите отзыв или предложение" rows="4" required></textarea>
                </label>
                <button type="submit">Отправить</button>
            </form>
        </section>

        <footer>
            <p>&copy; Copyright 2026</p>
        </footer>
    </body>
</html>
